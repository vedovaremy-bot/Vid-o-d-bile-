<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(../lib/fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Anton;src:url(../lib/fonts/Anton.ttf)}
html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/engine.js"></script>
<script>
const lw = (re, scene, n = 0) => wordTime(re, n, scene) - sceneStart(scene);
function popText(s, x, y, size, col, t0, lt, rot = -.06, until = 1e9) {
  if (lt < t0 || lt > until) return;
  const k = easeOutBack((lt - t0) / .3);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.rotate(rot); txt(s, 0, 0, size, col, 'Anton', 'center', size * .13); ctx.restore();
}
function bubble(x, y, w, h, s, size, tailX = 0, t0 = 0, lt = 1, until = 1e9) {
  if (lt < t0 || lt > until) return; const k = easeOutBack((lt - t0) / .3);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  rr(-w / 2, -h / 2, w, h, 40, '#fff'); poly([[tailX - 24, h / 2 - 4], [tailX + 24, h / 2 - 4], [tailX - 4, h / 2 + 56]], '#fff'); line(tailX - 20, h / 2 - 2, tailX + 20, h / 2 - 2, '#fff', 10);
  txt(s, 0, 4, size, OUT, 'Anton'); ctx.restore();
}
function heart(x, y, r, fill, lw2 = 8) {
  ctx.beginPath(); ctx.moveTo(x, y + r * .9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * .1, x - r * .9, y - r * 1.3, x, y - r * .45);
  ctx.bezierCurveTo(x + r * .9, y - r * 1.3, x + r * 1.6, y - r * .1, x, y + r * .9); shape(fill, lw2);
}

// ------------------------------------------------------------ LA SAUCISSE (personnage principal)
// o: {tie, shades, talk, angry, panic, smug, point, arms:[l,r], flip, sash, crown, blink, sit}
function sausage(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  if (!o.noShadow) shadow(0, 0, 110);
  const run = o.run ? Math.sin(t * 22) * .6 : 0;
  if (!o.sit) for (const [lx, sg] of [[-35, 1], [35, -1]]) { ctx.save(); ctx.translate(lx, -60); ctx.rotate(run * sg); line(0, 0, 0, 55, OUT, 14); rr(-8, 48, 44, 20, 10, '#2d3436', 4); ctx.restore(); }
  const bob = o.run ? -Math.abs(Math.sin(t * 22)) * 14 : Math.sin(t * 4) * 4;
  ctx.translate(0, bob);
  const [al, ar] = o.arms || [.5, -.5];
  for (const [side, a] of [[-1, al], [1, ar]]) { ctx.save(); ctx.translate(side * 82, -230); ctx.rotate(a * side); line(0, 0, side * 100, 0, OUT, 14); ell(side * 106, 0, 16, 16, '#c0392b', 4); ctx.restore(); }
  // ficelles aux bouts
  line(0, -470, -10, -500, '#fff', 6); line(0, -470, 12, -498, '#fff', 6);
  rr(-90, -480, 180, 420, 90, '#c0574b', 7);
  ctx.globalAlpha = .35; rr(-60, -440, 30, 260, 15, '#fff', 0); ctx.globalAlpha = 1;
  ctx.globalAlpha = .25; for (let i = 0; i < 4; i++) line(-40 + i * 25, -140 + i * 8, -20 + i * 25, -120 + i * 8, '#5a1e1e', 5); ctx.globalAlpha = 1;
  if (o.tie) { poly([[-14, -280], [14, -280], [20, -170], [0, -150], [-20, -170]], o.tie === true ? '#2980b9' : o.tie, 4); poly([[-20, -296], [20, -296], [12, -276], [-12, -276]], o.tie === true ? '#2980b9' : o.tie, 4); }
  if (o.sash) { ctx.save(); ctx.beginPath(); ctx.roundRect(-90, -480, 180, 420, 90); ctx.clip(); ctx.translate(0, -230); ctx.rotate(.7); ['#0055a4', '#fff', '#ef4135'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-200, -42 + i * 28, 400, 28); }); ctx.restore(); rr(-90, -480, 180, 420, 90, null, 7); }
  // visage
  const ey = -380;
  if (o.blink) { line(-50, ey, -14, ey, OUT, 6); line(14, ey, 50, ey, OUT, 6); }
  else {
    const er = o.panic ? 30 : 24;
    ell(-34, ey, er, er + 4, '#fff', 5); ell(34, ey, er, er + 4, '#fff', 5);
    ell(-32, ey + 4, 10, 12, '#111', 0); ell(36, ey + 4, 10, 12, '#111', 0); ell(-29, ey, 4, 4, '#fff', 0); ell(39, ey, 4, 4, '#fff', 0);
    if (o.smug) { for (const sx of [-1, 1]) { ctx.save(); ctx.beginPath(); ctx.ellipse(sx * 34, ey, 25, 29, 0, Math.PI, 0); shape('#c0574b', 5); ctx.restore(); } }
  }
  if (o.angry) { line(-64, ey - 46, -12, ey - 28, OUT, 8); line(64, ey - 46, 12, ey - 28, OUT, 8); }
  if (o.shades) { rr(-72, ey - 24, 64, 44, 14, '#111', 4); rr(8, ey - 24, 64, 44, 14, '#111', 4); line(-8, ey - 8, 8, ey - 8, '#111', 6); }
  const my = ey + 70;
  if (o.panic || (o.talk && Math.sin(t * 16) > 0)) ell(0, my, 22, 18, '#5a1e1e', 5);
  else if (o.angry) { ctx.beginPath(); ctx.arc(0, my + 18, 24, Math.PI * 1.15, Math.PI * 1.85); shape(null, 6); }
  else { ctx.beginPath(); ctx.arc(0, my - 14, 28, Math.PI * .15, Math.PI * .85); shape(null, 6); }
  if (o.panic) for (let i = 0; i < 2; i++) { const k = (t * 1.6 + i * .5) % 1; ell(-80 + i * 160, ey + k * 80, 10, 16, '#74b9ff', 3); }
  if (o.crown) poly([[-50, -470], [-56, -540], [-26, -505], [0, -550], [26, -505], [56, -540], [50, -470]], '#f9ca24', 5);
  ctx.restore();
}
function chipolata(x, y, s, t, sad) { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2); ctx.scale(s, s); rr(-24, -90, 48, 180, 24, '#c0574b', 5); ell(-8, -50, 6, 7, '#111', 0); ell(10, -50, 6, 7, '#111', 0); if (sad) { const k = (t * 1.5) % 1; ell(-8, -36 + k * 30, 4, 7, '#74b9ff', 0); } ctx.restore(); }
// ------------------------------------------------------------ décors
function office(night) {
  ctx.fillStyle = '#dfe6e9'; ctx.fillRect(-400, -400, W + 800, 1800);
  rr(620, 220, 380, 420, 10, '#74b9ff'); rr(600, 200, 420, 460, 14, null, 14); line(810, 200, 810, 660, '#fff', 12);
  ctx.fillStyle = '#b2bec3'; ctx.fillRect(-400, 1400, W + 800, 900);
  ctx.globalAlpha = .3; for (let x = -400; x < W + 400; x += 140) line(x, 1400, x - 200, 2300, '#95a5a6', 4); ctx.globalAlpha = 1;
  rr(80, 300, 200, 140, 6, '#fff', 5); txt('OBJECTIFS', 180, 330, 30, '#2d3436', 'Anton'); line(110, 400, 160, 370, '#e74c3c', 6); line(160, 370, 250, 410, '#e74c3c', 6);
}
function desk(x, y, w = 620, screen = true) {
  if (screen) { rr(x - 120, y - 260, 240, 170, 12, '#2d3436'); rr(x - 105, y - 245, 210, 140, 6, '#74b9ff', 0); rr(x - 15, y - 90, 30, 90, 4, '#2d3436', 0); }
  rr(x - w / 2, y, w, 50, 10, '#a0785a'); rr(x - w / 2 + 30, y + 50, 30, 400, 6, '#7d5a42'); rr(x + w / 2 - 60, y + 50, 30, 400, 6, '#7d5a42');
}
function chair(x, y) { rr(x - 90, y - 360, 180, 260, 40, '#2d3436'); rr(x - 110, y - 120, 220, 50, 20, '#2d3436'); line(x, y - 70, x, y - 10, '#636e72', 14); line(x - 70, y, x + 70, y, '#636e72', 12); }
const BOSS = { bald: true, shirt: '#2c3e50', pants: '#2c3e50', bowtie: '#e74c3c', mustache: true, hair: '#636e72' };

window.HANDLE = '@histoires.debiles';
window.SCENES = {
  hook(lt, d, g) {
    office();
    chair(540, 1600);
    sausage(540, 1560, 1.15, g, { tie: true, smug: true, sit: true }); desk(540, 1500, 700, false); rr(720, 1420, 120, 80, 8, '#2d3436'); rr(730, 1430, 100, 60, 4, '#74b9ff', 0);
    // collègues qui ne remarquent rien
    human(110, 1980, .7, g, { shirt: '#00b894', expr: 'neutral' }); human(980, 1980, .7, g + 1, { shirt: '#fdcb6e', longHair: true, hair: '#2d3436', expr: 'neutral', flip: true });
    popText('???', 540, 300, 200, '#ffd32a', lw(/personne/i, 'hook'), lt, 0);
    const tag = lw(/saucisse/i, 'hook');
    if (lt > tag) { const k = easeOutBack((lt - tag) / .3); ctx.save(); ctx.translate(540, 520); ctx.scale(k, k); rr(-260, -60, 520, 120, 20, '#fff', 6); txt('🪪 EMPLOYÉ DU MOIS', 0, 6, 50, '#2d3436', 'Anton'); ctx.restore(); }
  },
  desk(lt, d, g) {
    office();
    chair(640, 1600);
    sausage(640, 1560, 1.1, g, { tie: lt > lw(/cravate/i, 'desk') - .3, smug: true, sit: true }); desk(640, 1500, 640, false); rr(820, 1420, 120, 80, 8, '#2d3436'); rr(830, 1430, 100, 60, 4, '#74b9ff', 0);
    human(170, 1980, .95, g, { expr: lt > lw(/assise/i, 'desk') ? 'shock' : 'neutral' });
    popText('TA PLACE', 600, 330, 170, '#ffd32a', lw(/place/i, 'desk'), lt, -.05, lw(/cravate/i, 'desk') - .1);
    popText('TA CRAVATE', 600, 330, 170, '#ff3838', lw(/cravate/i, 'desk'), lt, .05);
  },
  like(lt, d, g) {
    // gros plan : la saucisse parle à la caméra
    const gr = ctx.createRadialGradient(540, 900, 50, 540, 900, 1200); gr.addColorStop(0, '#ff9ff3'); gr.addColorStop(1, '#5f27cd'); ctx.fillStyle = gr; ctx.fillRect(-400, -400, W + 800, H + 800);
    const tl = lw(/toi/i, 'like', 1);
    ctx.save();
    sausage(540, 1840, 2.6, g, { tie: true, talk: lt > lw(/dit/i, 'like') - .1 && lt < d - .3, angry: lt > lw(/sinon/i, 'like'), arms: lt > tl ? [.5, 2.2] : [.4, -.4], noShadow: true });
    ctx.restore();
    // énorme bouton like
    const lk = lw(/like/i, 'like');
    if (lt > lk - .2) {
      const k = easeOutBack((lt - lk + .2) / .35), beat = 1 + Math.max(0, Math.sin(g * 9)) * .08;
      ctx.save(); ctx.translate(540, 330); ctx.scale(k * beat * .85, k * beat * .85);
      ell(0, 0, 200, 200, '#fff', 10); heart(0, 10, 110, '#ff3838', 10);
      ctx.restore();
      // doigt qui pointe le bouton
      const tap = Math.abs(Math.sin(g * 6)) * 30;
      ctx.save(); ctx.translate(760 + tap * .5, 480 + tap); ctx.rotate(-.6); rr(-36, 0, 72, 260, 36, '#f3c9a4'); rr(-22, 8, 44, 46, 14, '#fbe3d2', 4); ctx.restore();
      popText('LÂCHE UN LIKE', 540, 1580, 140, '#ffd32a', lk, lt, -.04);
    }
    const ms = lw(/maison/i, 'like');
    if (lt > ms) { const k = easeOutBack((lt - ms) / .3); ctx.save(); ctx.translate(180, 700); ctx.scale(k, k); ctx.rotate(-.1); rr(-150, -120, 300, 220, 10, '#f6e3c5', 6); poly([[-180, -110], [0, -230], [180, -110]], '#c0392b'); txt('😈', 0, 0, 90, '#000', 'serif'); ctx.restore(); }
  },
  boss(lt, d, g) {
    office();
    chair(380, 1600);
    sausage(380, 1560, 1.05, g, { tie: true, smug: true, sit: true }); desk(380, 1500, 600, false); rr(560, 1420, 120, 80, 8, '#2d3436'); rr(570, 1430, 100, 60, 4, '#74b9ff', 0);
    human(850, 1980, 1.0, g, { ...BOSS, flip: true, expr: 'neutral', armR: lt > lw(/excellent/i, 'boss') ? 2.4 : -.15 });
    bubble(780, 640, 560, 170, 'EXCELLENT TRAVAIL !', 60, 60, lw(/excellent/i, 'boss') - .2, lt);
    popText('CHAMPION', 540, 330, 170, '#ffd32a', lw(/champion/i, 'boss'), lt, -.05);
    if (lt > lw(/excellent/i, 'boss')) { ctx.save(); ctx.translate(560, 900); txt('👍', 0, 0, 120, '#000', 'serif'); ctx.restore(); }
  },
  meeting(lt, d, g) {
    office();
    // tableau blanc
    rr(140, 240, 800, 520, 16, '#fff', 8);
    const w = lw(/mot/i, 'meeting');
    if (lt > w) { ctx.save(); ctx.beginPath(); ctx.rect(160, 260, 760 * clamp((lt - w) / 1.0), 480); ctx.clip(); txt('SAUCISSE.', 540, 500, 150, '#e74c3c', 'Anton'); ctx.restore(); }
    sausage(800, 1700, .9, g, { tie: true, talk: lt > w && lt < w + 1.5, arms: [.5, 1.6] });
    const ap = lw(/applaudit/i, 'meeting');
    for (let i = 0; i < 4; i++) { const clap = lt > ap && Math.sin(g * 20 + i) > 0; human(90 + i * 170, 2000, .6, g + i, { shirt: ['#00b894', '#0984e3', '#fdcb6e', '#e17055'][i], expr: lt > ap ? 'shock' : 'neutral', armL: clap ? -1.0 : -.6, armR: clap ? 1.0 : .6, longHair: i % 2 === 1, hair: i % 2 ? '#2d3436' : undefined }); }
    rr(-100, 1640, 1300, 60, 10, '#a0785a');
    if (lt > ap) for (let i = 0; i < 8; i++) { const R = rnd(i + 3); popText('CLAP', 100 + R() * 880, 900 + R() * 300, 60 + R() * 30, '#fff', ap + i * .1, lt, (R() - .5) * .6); }
  },
  promo(lt, d, g) {
    const pl = lw(/placard/i, 'promo') - .2;
    if (lt < pl) {
      // grand bureau avec vue
      ctx.fillStyle = '#2d3436'; ctx.fillRect(-400, -400, W + 800, H + 800);
      sky('#74b9ff', '#dff9fb'); for (let i = 0; i < 7; i++) rr(i * 170 - 60, 700 - (i * 97 % 300), 130, 900, 4, '#636e72');
      ctx.fillStyle = '#2d3436'; for (let x = 0; x < W; x += 360) ctx.fillRect(x - 10, 0, 20, 1400); ctx.fillRect(-400, 1400, W + 800, 900);
      sausage(540, 1800, 1.25, g, { tie: '#f9ca24', shades: true, arms: [-1.2, 1.2] });
      popText('+ AUGMENTATION', 540, 330, 120, '#2ed573', lw(/augmentation/i, 'promo'), lt, -.04);
      popText('VUE', 540, 560, 160, '#fff', lw(/vue/i, 'promo'), lt, .05);
    } else {
      office();
      // le placard
      rr(260, 380, 560, 1200, 10, '#a0785a');
      rr(290, 410, 500, 1140, 4, '#3d2b1f', 0);
      ctx.save(); ctx.beginPath(); ctx.rect(290, 410, 500, 1140); ctx.clip();
      human(540, 1780, .9, g, { expr: 'sad', armL: .1, armR: -.1 });
      for (let i = 0; i < 3; i++) rr(320, 470 + i * 70, 440, 18, 4, '#5d4037', 0);
      ctx.restore();
      ctx.save(); ctx.translate(820, 380); ctx.scale(.25, 1); rr(0, 0, 560, 1200, 10, '#b98b6a'); ctx.restore();
      popText('AU PLACARD', 540, 260, 170, '#ff3838', 0, lt - pl, -.05);
      popText('LITTÉRALEMENT', 540, 1720, 120, '#ffd32a', lw(/littéralement/i, 'promo'), lt, .04);
    }
  },
  lunch(lt, d, g) {
    ctx.fillStyle = '#ffeaa7'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.globalAlpha = .3; for (let x = -400; x < W + 400; x += 90) for (let y = -400; y < 1400; y += 90) if (((x + y) / 90) % 2 === 0) rr(x, y, 90, 90, 0, '#fdcb6e', 0); ctx.globalAlpha = 1;
    rr(-100, 1450, W + 200, 900, 0, '#636e72', 0);
    sausage(540, 1500, 1.3, g, { tie: true, talk: true, arms: [.3, 1.8], noShadow: true });
    // plateau-repas
    rr(140, 1440, 800, 300, 30, '#b2bec3'); ell(540, 1580, 260, 110, '#fff');
    const sad = lt > lw(/cousines/i, 'lunch');
    for (let i = 0; i < 4; i++) chipolata(400 + i * 90, 1580, .8, g + i, sad);
    // fourchette
    ctx.save(); ctx.translate(820, 1130); ctx.rotate(.4); rr(-10, 0, 20, 260, 6, '#b2bec3'); for (let i = -1; i <= 1; i++) rr(i * 14 - 4, -60, 8, 60, 3, '#b2bec3'); chipolata(0, -30, .5, g, true); ctx.restore();
    popText('SES COUSINES', 540, 330, 160, '#ff3838', lw(/cousines/i, 'lunch'), lt, -.05);
    popText('…', 540, 560, 160, '#2d3436', lw(/personne/i, 'lunch'), lt, 0);
  },
  bbq(lt, d, g) {
    office();
    sausage(780, 1850, .95, g, { tie: true, panic: lt > lw(/barbecue/i, 'bbq') });
    human(320, 1980, 1.0, g, { expr: 'angry', armL: -1.2, armR: 1.2 });
    const b = lw(/barbecue/i, 'bbq');
    if (lt > b - .4) {
      const k = easeOutBack((lt - b + .4) / .4);
      ctx.save(); ctx.translate(320, 1260); ctx.scale(k, k);
      rr(-170, -20, 340, 110, 20, '#2d3436'); for (let i = -3; i <= 3; i++) line(i * 45, -20, i * 45, 90, '#636e72', 4);
      line(-120, 90, -160, 300, '#2d3436', 12); line(120, 90, 160, 300, '#2d3436', 12);
      for (let i = 0; i < 5; i++) { const f = Math.sin(g * 10 + i) * 14; poly([[-140 + i * 70, -20], [-110 + i * 70, -120 - f], [-80 + i * 70, -20]], ['#ff9f43', '#ff6b6b'][i % 2], 4); }
      ctx.restore();
      popText('BARBECUE', 540, 330, 180, '#ff9f43', b, lt, -.05);
    }
  },
  flee(lt, d, g) {
    office();
    const m = lw(/moutarde/i, 'flee') - .3;
    // flaque de moutarde
    ell(620, 1700, 260, 50, '#f9ca24', 5);
    if (lt < m) sausage(lerp(200, 600, clamp(lt / m)), 1690, .9, g, { panic: true, tie: true, run: true });
    else {
      const k = clamp((lt - m) / 1.2);
      ctx.save(); ctx.translate(lerp(600, 1000, k), lerp(1690, 900, k) - Math.sin(k * Math.PI) * 400); ctx.rotate(k * 9);
      sausage(0, 200, .8, g, { panic: true, tie: true, noShadow: true }); ctx.restore();
      popText('GLISSE !', 540, 330, 190, '#f9ca24', lw(/moutarde/i, 'flee'), lt, -.06);
    }
    // pot de moutarde renversé
    ctx.save(); ctx.translate(880, 1710); ctx.rotate(1.4); rr(-50, -80, 100, 160, 16, '#f9ca24'); rr(-56, -96, 112, 30, 8, '#2d3436'); ctx.restore();
    popText('PANIQUE', 540, 330, 180, '#ff3838', lw(/panique/i, 'flee'), lt, .05, m + .2);
  },
  back(lt, d, g) {
    office();
    chair(400, 1600); desk(400, 1500, 600);
    human(400, 1980, .95, g, { expr: lt > lw(/qui/i, 'back') ? 'shock' : 'neutral' });
    rr(100, 1500, 600, 50, 10, '#a0785a');
    human(880, 1980, 1.0, g, { ...BOSS, flip: true, expr: 'neutral' });
    bubble(760, 640, 520, 170, 'VOUS ÊTES QUI ?', 70, 80, lw(/vous/i, 'back') - .1, lt);
    popText('RÉCUPÉRÉ', 540, 330, 160, '#2ed573', lw(/récupères/i, 'back'), lt, -.05, lw(/vous/i, 'back') - .2);
  },
  minister(lt, d, g) {
    sky(); clouds(g);
    // ministère
    rr(80, 300, 920, 1150, 6, '#f5f0e1'); poly([[40, 310], [540, 120], [1040, 310]], '#dcd2b8');
    for (let i = 0; i < 6; i++) rr(140 + i * 150, 500, 60, 900, 6, '#e8dcc0');
    rr(340, 380, 400, 80, 6, '#2d3436'); txt('MINISTÈRE', 540, 422, 56, '#f9ca24', 'Anton');
    ['#0055a4', '#fff', '#ef4135'].forEach((c, i) => rr(900 + i * 40, 160, 40, 80, 0, c, 3)); line(900, 160, 900, 330, '#2d3436', 6);
    // balcon avec la saucisse ministre
    rr(340, 900, 400, 40, 6, '#b2bec3');
    sausage(540, 900, .75, g, { sash: true, smug: true, arms: [-.3, -2.4] });
    ctx.fillStyle = '#95a5a6'; ctx.fillRect(-400, 1450, W + 800, 900);
    // stand de hot-dogs
    const hd = lw(/hot/i, 'minister');
    rr(560, 1560, 440, 260, 20, '#e74c3c'); rr(560, 1380, 440, 60, 10, '#f9ca24'); txt('HOT-DOGS', 780, 1412, 50, '#e74c3c', 'Anton');
    line(580, 1440, 580, 1560, '#2d3436', 8); line(980, 1440, 980, 1560, '#2d3436', 8); ell(640, 1830, 40, 40, '#2d3436'); ell(920, 1830, 40, 40, '#2d3436');
    human(330, 1980, .9, g, { expr: 'sad', cap: '#e74c3c' });
    popText('MINISTRE', 540, 1180, 150, '#0055a4', lw(/ministre/i, 'minister'), lt, -.05, hd - .1);
  },
  outro(lt, d, g) {
    office();
    // 3 collègues… l'un d'eux est une saucisse
    human(200, 1980, .8, g, { shirt: '#0984e3', expr: 'neutral' });
    sausage(540, 1960, .85, g + 1, { tie: true, smug: true, blink: (g % 2.6) > 2.45 });
    human(880, 1980, .8, g + 2, { shirt: '#e17055', longHair: true, hair: '#2d3436', expr: 'neutral' });
    const p = easeOutBack((lt - .1) / .4);
    if (p > 0) { ctx.save(); ctx.translate(540, 300); ctx.scale(p, p); rr(-300, -80, 600, 160, 80, '#ff3838', 0); txt("S'ABONNER", 0, 6, 90, '#fff', 'Anton'); ctx.restore(); }
    const s = lw(/saucisse/i, 'outro');
    if (lt > s) { const k = easeOutBack((lt - s) / .3); ctx.save(); ctx.translate(540, 960); ctx.scale(k, k); ell(0, 0, 150, 150, null, 16); line(105, 105, 220, 220, '#2d3436', 28); ctx.restore(); }
  },
};
</script></body></html>
