<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(../lib/fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Anton;src:url(../lib/fonts/Anton.ttf)}
html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/engine.js"></script>
<script src="../lib/common.js"></script>
<script>
window.HOOK_TITLE = "Quand ta mère dit\n« y a à manger\nà la maison »";
const MOM = { longHair: true, hair: '#8e6e53', shirt: '#e17055' };
function kitchen() { ctx.fillStyle = '#fbe9c6'; ctx.fillRect(-400, -400, W + 800, H + 800); ctx.globalAlpha = .3; for (let x = -400; x < W + 400; x += 90) line(x, 400, x, 1500, '#d4b483', 3); ctx.globalAlpha = 1; ctx.fillStyle = '#d7ccc8'; ctx.fillRect(-400, 1500, W + 800, 900); }
function egg(x, y, s, t, o = {}) { ctx.save(); ctx.translate(x, y + Math.sin(t * 4) * 4); ctx.scale(s, s); ell(0, -110, 80, 110, '#fffdf3', 6); ell(-26, -130, 12, 14, '#111', 0); ell(26, -130, 12, 14, '#111', 0); if (o.angry) { line(-46, -164, -12, -150, OUT, 6); line(46, -164, 12, -150, OUT, 6); } if (o.talk && Math.sin(t * 16) > 0) ell(0, -80, 16, 12, '#7a2b2b', 4); else { ctx.beginPath(); ctx.arc(0, -96, 18, Math.PI * .15, Math.PI * .85); shape(null, 5); } if (o.crack) { ctx.beginPath(); ctx.moveTo(-60, -170); ctx.lineTo(-20, -150); ctx.lineTo(10, -175); ctx.lineTo(40, -150); shape(null, 5); } ctx.restore(); }
function carrot(x, y, s, t) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(.3); poly([[-30, -200], [30, -200], [0, 0]], '#e67e22', 5); for (let i = -1; i <= 1; i++) ell(i * 16, -220, 10, 30, '#6ab04c', 3); ell(-10, -150, 6, 7, '#111', 0); ell(10, -150, 6, 7, '#111', 0); ctx.beginPath(); ctx.arc(0, -115, 12, Math.PI * 1.15, Math.PI * 1.85); shape(null, 4); const k = (t * 1.3) % 1; ell(-12, -140 + k * 40, 4, 7, '#74b9ff', 0); ctx.restore(); }
function mustard(x, y, s, t) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rr(-60, -180, 120, 180, 20, '#f9ca24', 5); rr(-66, -200, 132, 30, 8, '#2d3436', 4); txt('2009', 0, -90, 40, '#7f5f00', 'Anton'); ctx.restore(); for (let i = 0; i < 4; i++) { const a = t * 4 + i * 1.6; txt('•', x + Math.cos(a) * 90 * s, y - 220 * s + Math.sin(a) * 30, 40, '#2d3436', 'serif'); } }
function fridge(open) { rr(180, 380, 720, 1140, 30, '#f5f6fa', 8); if (open) { rr(210, 410, 660, 1080, 14, '#dff9fb', 0); for (const y of [760, 1120]) rr(210, y, 660, 14, 4, '#b2bec3', 0); ctx.save(); ctx.globalAlpha = .25; ell(540, 700, 300, 200, '#fff', 0); ctx.restore(); } else { line(180, 760, 900, 760, '#b2bec3', 8); rr(820, 480, 26, 220, 12, '#b2bec3', 0); } }
function firefighter(x, y, s, g, o = {}) { human(x, y, s, g, { cap: '#f9ca24', shirt: '#2d3436', pants: '#2d3436', mustache: o.mustache, expr: o.expr || 'neutral', armR: o.armR, phone: o.phone, flip: o.flip }); }

window.SCENES = {
  hook(lt, d, g) {
    kitchen();
    human(250, 2300, 1.0, g, { expr: lt > lw(/non/i, 'hook') ? 'sad' : 'neutral', armR: 1.4 });
    human(820, 2300, 1.0, g, { ...MOM, expr: 'angry', flip: true, armR: lt > lw(/non/i, 'hook') ? 1.6 : -.1 });
    if (lt > lw(/burger/i, 'hook') - .2) bubble(300, 980, 340, 130, '🍔 ?', 70, -40, lw(/burger/i, 'hook') - .2, lt, lw(/non/i, 'hook'));
    bubble(780, 980, 300, 130, 'NON.', 80, 40, lw(/non/i, 'hook'), lt);
  },
  fridge(lt, d, g) {
    kitchen(); fridge(true);
    egg(380, 740, 1.0, g, {});
    if (lt > lw(/carotte/i, 'fridge') - .3) carrot(660, 740, 1.0, g);
    if (lt > lw(/moutarde/i, 'fridge') - .3) mustard(540, 1110, 1.0, g);
    popText('C\'EST TOUT ?!', 540, 1650, 150, '#ff3838', lw(/2009/i, 'fridge') + .4, lt, -.05);
  },
  egg(lt, d, g) {
    const gr = ctx.createRadialGradient(540, 900, 50, 540, 900, 1200); gr.addColorStop(0, '#dff9fb'); gr.addColorStop(1, '#74b9ff'); ctx.fillStyle = gr; ctx.fillRect(-400, -400, W + 800, H + 800);
    egg(540, 2050, 3.6, g, { talk: true, angry: lt > lw(/sinon/i, 'egg'), crack: lt > lw(/omelette/i, 'egg') });
    const ab = lw(/abonne/i, 'egg');
    if (lt > ab - .2) { const p = easeOutBack((lt - ab + .2) / .35), beat = 1 + Math.max(0, Math.sin(g * 9)) * .06; ctx.save(); ctx.translate(540, 330); ctx.scale(p * beat, p * beat); rr(-330, -90, 660, 180, 90, '#ff3838', 0); txt("S'ABONNER", 0, 6, 100, '#fff', 'Anton'); ctx.restore(); }
    popText('…SINON 🍳', 540, 560, 130, '#e1b12c', lw(/sinon/i, 'egg'), lt, -.04);
  },
  cook(lt, d, g) {
    kitchen();
    rr(440, 1450, 560, 60, 10, '#636e72'); ell(720, 1440, 200, 40, '#2d3436');
    const ex = lw(/explose/i, 'cook');
    if (lt < ex) { human(250, 2300, 1.0, g, { expr: 'neutral', armR: 1.2 + Math.sin(g * 10) * .3 }); ell(720, 1420, 140, 26, '#e67e22', 0); }
    else { const k = clamp((lt - ex) / 1.2); ctx.save(); ctx.globalAlpha = 1 - k * .3; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; ell(540 + Math.cos(a) * 260 * (k + .3), 1100 + Math.sin(a) * 220 * (k + .3), 130, 110, i % 2 ? '#636e72' : '#ff9f43', 0); } ctx.restore(); human(250, 2300, 1.0, g, { expr: 'shock', hair: '#2d3436', shirt: '#636e72' }); }
    if (lt > lw(/pompiers/i, 'cook')) firefighter(900, 2250, .85, g, { flip: true, expr: 'shock' });
    popText('BOUM', 540, 700, 220, '#ff3838', ex, lt, -.06);
  },
  fire(lt, d, g) {
    kitchen();
    for (let i = 0; i < 2; i++) firefighter([300, 780][i], 2300, 1.0, g + i, { expr: lt > lw(/pleurent/i, 'fire') ? 'sad' : 'neutral', armR: lt > lw(/mère/i, 'fire') && i === 1 ? 2.7 : 1.5, phone: i === 1 && lt > lw(/mère/i, 'fire'), flip: i === 1 });
    if (lt < lw(/pleurent/i, 'fire')) { ctx.save(); ctx.translate(540, 1100); ell(0, 0, 160, 40, '#fff', 5); ell(0, -10, 120, 24, '#6d4c41', 0); ctx.restore(); }
    popText('ILS PLEURENT', 540, 700, 150, '#74b9ff', lw(/pleurent/i, 'fire'), lt, -.05, lw(/mère/i, 'fire') - .1);
    popText('📞 MAMAN', 540, 700, 150, '#fff', lw(/mère/i, 'fire'), lt, .05);
  },
  loop(lt, d, g) {
    kitchen();
    firefighter(250, 2300, 1.0, g, { expr: lt > lw(/non/i, 'loop') ? 'sad' : 'neutral', phone: true, armR: 2.7 });
    rr(560, 380, 440, 520, 30, '#2d3436', 6); ctx.save(); ctx.beginPath(); ctx.roundRect(580, 400, 400, 480, 20); ctx.clip(); ctx.fillStyle = '#fbe9c6'; ctx.fillRect(580, 400, 400, 480); human(780, 1110, .55, g, { hair: '#dfe6e9', bun: true, glasses: true, shirt: '#a29bfe', expr: 'angry' }); ctx.restore();
    bubble(780, 1060, 300, 120, 'NON.', 70, 0, lw(/non/i, 'loop'), lt);
  },
};
</script></body></html>
