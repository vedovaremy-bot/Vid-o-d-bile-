<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(../lib/fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Anton;src:url(../lib/fonts/Anton.ttf)}
html,body{margin:0;background:#000} canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/engine.js"></script>
<script src="../lib/common.js"></script>
<script>
// ------------------------------------------------------------ L'ASPIRATEUR ROBOT (personnage principal)
// o: {evil, talk, smug, shake, suck (tourbillon devant), crown}
function robot(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x + (o.shake ? Math.sin(t * 50) * 5 : 0), y); ctx.scale(s, s);
  shadow(0, 0, 260);
  // corps (cylindre plat vu de 3/4)
  ell(0, -60, 250, 70, '#2d3436');
  rr(-250, -150, 500, 90, 0, '#2d3436', 0); line(-250, -150, -250, -60, OUT, 7); line(250, -150, 250, -60, OUT, 7);
  ell(0, -150, 250, 70, o.evil ? '#636e72' : '#dfe6e9');
  ell(0, -160, 120, 30, '#b2bec3', 4); ell(0, -165, 30, 10, o.evil ? '#ff3838' : '#55efc4', 0);
  // brosses latérales
  for (const sx of [-1, 1]) { ctx.save(); ctx.translate(sx * 200, -30); ctx.rotate(t * 12 * sx); for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI * 2 / 3); line(0, 0, 60, 0, '#636e72', 5); } ctx.restore(); }
  // visage sur la face avant
  const ey = -110;
  for (const sx of [-1, 1]) { if (o.evil) { rr(sx * 70 - 30, ey - 12, 60, 24, 10, '#ff3838', 0); ctx.save(); ctx.globalAlpha = .35; ell(sx * 70, ey, 60, 34, '#ff3838', 0); ctx.restore(); } else { ell(sx * 70, ey, 20, 22, '#55efc4', 0); if (!o.smug) ell(sx * 70 + 4, ey, 8, 10, '#111', 0); else line(sx * 70 - 16, ey, sx * 70 + 16, ey, '#111', 6); } }
  if (o.talk && Math.sin(t * 16) > 0) rr(-40, -80, 80, 22, 8, o.evil ? '#ff3838' : '#55efc4', 0); else line(-30, -72, 30, -72, o.evil ? '#ff3838' : '#55efc4', 6);
  if (o.crown) poly([[-70, -200], [-80, -280], [-40, -240], [0, -300], [40, -240], [80, -280], [70, -200]], '#f9ca24', 5);
  ctx.restore();
  if (o.suck) { ctx.save(); ctx.globalAlpha = .5; for (let i = 0; i < 6; i++) { const k = (t * 2 + i / 6) % 1; ctx.beginPath(); ctx.arc(x + (1 - k) * 300 * s, y - 60 * s, (1 - k) * 120 * s, 0, Math.PI * 1.5); shape(null, 6, '#fff'); } ctx.restore(); }
}
function sucked(x0, y0, x1, y1, k, draw) { if (k <= 0 || k >= 1) return; ctx.save(); ctx.translate(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.rotate(k * 10); ctx.scale(1 - k * .8, 1 - k * .8); draw(); ctx.restore(); }
function sock() { rr(-30, -90, 60, 120, 20, '#ff7675', 5); rr(-30, 10, 100, 44, 20, '#ff7675', 5); }
function cat() { ell(0, 0, 90, 70, '#e58e26', 5); poly([[-60, -40], [-50, -110], [-10, -60]], '#e58e26', 5); poly([[60, -40], [50, -110], [10, -60]], '#e58e26', 5); ell(-26, -10, 12, 14, '#111', 0); ell(26, -10, 12, 14, '#111', 0); }
function livingRoom() { apartment('#dfe6e9', '#a0785a'); ell(540, 1720, 520, 160, '#0984e3', 0); }
function eiffel(x, y, s, shine) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const c = shine ? '#f9ca24' : '#8d6e63';
  poly([[-260, 0], [-60, -900], [60, -900], [260, 0]], null, 0);
  ctx.beginPath(); ctx.moveTo(-260, 0); ctx.quadraticCurveTo(-100, -400, -40, -900); ctx.lineTo(40, -900); ctx.quadraticCurveTo(100, -400, 260, 0); ctx.lineTo(160, 0); ctx.quadraticCurveTo(0, -260, -160, 0); ctx.closePath(); shape(c, 6);
  rr(-170, -330, 340, 30, 6, c, 5); rr(-90, -620, 180, 24, 6, c, 5); rr(-14, -1080, 28, 180, 6, c, 4);
  ctx.globalAlpha = .4; for (let i = 0; i < 8; i++) line(-200 + i * 20, -60 - i * 100, 200 - i * 20, -160 - i * 100, '#5d4037', 4); ctx.globalAlpha = 1;
  if (shine) { for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; line(Math.cos(a) * 300, -500 + Math.sin(a) * 500, Math.cos(a) * 420, -500 + Math.sin(a) * 650, 'rgba(249,202,36,.6)', 10); } }
  ctx.restore();
}

window.SCENES = {
  hook(lt, d, g) {
    livingRoom();
    robot(540, 1850, 1.8, g, { evil: lt > lw(/pouvoir/i, 'hook'), crown: lt > lw(/pouvoir/i, 'hook'), suck: lt > lw(/aspiré/i, 'hook') });
    const as = lw(/aspiré/i, 'hook');
    sucked(900, 900, 700, 1700, (lt - as) / 1.2, () => rr(-120, -60, 240, 120, 10, '#6d4c41', 5));
    sucked(200, 1100, 500, 1700, (lt - as - .3) / 1.2, () => cat());
    popText('LE POUVOIR', 540, 330, 180, '#ff3838', lw(/pouvoir/i, 'hook'), lt, -.05, as - .1);
    popText('TOUT ASPIRÉ', 540, 330, 170, '#fff', as, lt, .05);
  },
  start(lt, d, g) {
    livingRoom();
    robot(420 + Math.sin(g * .8) * 120, 1850, 1.3, g, { suck: true });
    sucked(900, 1700, 450, 1760, (lt - lw(/chaussette/i, 'start')) / 1.0, () => sock());
    for (let i = 0; i < 10; i++) { const k = clamp((lt - lw(/miettes/i, 'start')) / 2 - i * .05); if (k < 1) ell(lerp(100 + i * 90, 400, k), lerp(1700 + (i % 3) * 40, 1760, k), 10, 8, '#e1a95f', 0); }
    popText('MIAM LES MIETTES', 540, 330, 140, '#fff', lw(/miettes/i, 'start'), lt, -.04);
  },
  more(lt, d, g) {
    livingRoom();
    robot(480, 1860, 1.3, g, { suck: lt < lw(/ressorti/i, 'more'), smug: true });
    sucked(950, 1000, 600, 1760, (lt - lw(/devoirs/i, 'more')) / 1.0, () => { rr(-90, -120, 180, 240, 6, '#fff', 5); txt('MATHS', 0, -60, 34, '#e74c3c', 'Anton'); });
    sucked(150, 1400, 550, 1760, (lt - lw(/télécommande/i, 'more')) / 1.0, () => rr(-30, -100, 60, 200, 20, '#2d3436', 5));
    const ch = lw(/chat/i, 'more'), re = lw(/ressorti/i, 'more');
    if (lt < ch) { ctx.save(); ctx.translate(880, 1650); cat(); ctx.restore(); }
    sucked(880, 1650, 550, 1760, (lt - ch) / 1.0, () => cat());
    if (lt > re) { const k = easeOutBack((lt - re) / .4); ctx.save(); ctx.translate(820, 1500); ctx.scale(k * 1.2, k * 1.2); ell(0, 0, 90, 70, '#fdebd0', 5); poly([[-60, -40], [-50, -110], [-10, -60]], '#fdebd0', 5); poly([[60, -40], [50, -110], [10, -60]], '#fdebd0', 5); ell(-26, -10, 14, 16, '#111', 0); ell(26, -10, 14, 16, '#111', 0); for (let i = 0; i < 5; i++) txt('✦', -100 + i * 50, -140 + Math.sin(g * 4 + i) * 10, 40, '#74b9ff', 'serif'); ctx.restore(); }
    popText('LE CHAT ?!', 540, 330, 190, '#ff3838', ch, lt, -.05, re - .1);
    popText('TOUT PROPRE', 540, 330, 180, '#74b9ff', re + .6, lt, .05);
  },
  evil(lt, d, g) {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(-400, -400, W + 800, H + 800); ctx.fillStyle = '#2d3436'; ctx.fillRect(-400, 1500, W + 800, 900);
    const ro = lw(/rouges/i, 'evil');
    if (lt > ro) { ctx.save(); ctx.globalAlpha = .25 + Math.sin(g * 6) * .1; ell(540, 1700, 500, 300, '#ff3838', 0); ctx.restore(); }
    robot(540, 1900, 2.0, g, { evil: lt > ro, talk: lt > lw(/grave/i, 'evil'), shake: lt > lw(/disparaître/i, 'evil') });
    popText('LA SALETÉ…', 540, 330, 170, '#ff3838', lw(/saleté/i, 'evil'), lt, -.05, lw(/disparaître/i, 'evil') - .1);
    popText('DOIT DISPARAÎTRE', 540, 330, 130, '#ff3838', lw(/disparaître/i, 'evil'), lt, .04);
  },
  army(lt, d, g) {
    livingRoom();
    rr(380, 600, 320, 90, 10, '#2d3436'); rr(400, 620, 280, 30, 6, '#111', 0); // boîte aux lettres (fente)
    const ar = lw(/arrivent/i, 'army');
    const n = Math.min(20, Math.max(0, Math.floor((lt - ar) * 8)));
    for (let i = 0; i < n; i++) { const x = 80 + (i * 173) % 920, y = 1550 + ((i * 97) % 380); robot(x, y, .32, g + i, { evil: true }); }
    if (lt > ar && lt < ar + 2.5) { const k = (lt * 3) % 1; robot(540, lerp(700, 1500, k), .3, g, { evil: true }); }
    robot(540, 1880, 1.1, g, { evil: true, crown: true, talk: lt < ar });
    popText('x200', 540, 330, 220, '#ff3838', lw(/cousins/i, 'army'), lt, -.06, lw(/partout/i, 'army') - .1);
    popText('PARTOUT', 540, 330, 200, '#fff', lw(/partout/i, 'army'), lt, .05);
  },
  city(lt, d, g) {
    sky('#74b9ff', '#dff9fb'); clouds(g); ctx.fillStyle = '#b2bec3'; ctx.fillRect(-400, 1450, W + 800, 900);
    for (let i = 0; i < 5; i++) rr(i * 230 - 40, 800, 210, 650, 6, ['#fab1a0', '#ffeaa7', '#81ecec', '#a29bfe', '#fd79a8'][i]);
    for (let i = 0; i < 6; i++) robot(100 + i * 180 + Math.sin(g * 2 + i) * 30, 1850 - (i % 2) * 120, .4, g + i, { evil: true, suck: true });
    sucked(300, 900, 300, 1750, (lt - lw(/feuilles/i, 'city')) / 1, () => ell(0, 0, 40, 24, '#e67e22', 4));
    sucked(700, 700, 700, 1700, (lt - lw(/pigeons/i, 'city')) / 1, () => { ell(0, 0, 60, 40, '#9aa3ae', 5); ell(40, -30, 30, 26, '#7d8693', 5); });
    sucked(900, 1500, 900, 1750, (lt - lw(/trottinettes/i, 'city')) / 1, () => { line(-80, 0, 80, 0, OUT, 12); line(60, 0, 80, -150, OUT, 10); });
    const ma = lw(/maire/i, 'city'), mo = lw(/moustache/i, 'city');
    if (lt > ma - .3) { human(540, 2250, .85, g, { sash: true, mustache: lt < mo, hair: '#636e72', shirt: '#2d3436', expr: lt > mo ? 'shock' : 'neutral', armR: lt < mo ? 1.5 : -.1 }); }
    if (lt > mo) sucked(560, 1380, 560, 1800, (lt - mo) / .8, () => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-40, -16, -70, 12); ctx.quadraticCurveTo(-40, 0, 0, 10); ctx.quadraticCurveTo(40, 0, 70, 12); ctx.quadraticCurveTo(40, -16, 0, 0); shape('#636e72', 4); });
    popText('LE MAIRE…', 540, 330, 180, '#0055a4', ma, lt, -.05, mo - .1);
    popText('SA MOUSTACHE', 540, 330, 160, '#ff3838', mo, lt, .05);
  },
  tower(lt, d, g) {
    const lu = lw(/lune/i, 'tower');
    if (lt < lu - .3) {
      sky('#a5d8ff', '#e7f5ff'); ctx.fillStyle = '#78e08f'; ctx.fillRect(-400, 1700, W + 800, 400);
      const br = lw(/brillante/i, 'tower');
      eiffel(540, 1720, 1.15, lt > br);
      for (let i = 0; i < 4; i++) { const k = (g * .3 + i / 4) % 1; robot(lerp(300, 780, i % 2) + Math.sin(g + i) * 40, lerp(1650, 700, k), .25, g + i, { evil: true }); }
      popText('TOUR EIFFEL', 540, 260, 170, '#fff', lw(/eiffel/i, 'tower'), lt, -.05, br - .1);
      popText('BRILLANTE', 540, 260, 200, '#f9ca24', br, lt, .05);
    } else {
      ctx.fillStyle = '#05050f'; ctx.fillRect(-400, -400, W + 800, H + 800);
      for (let i = 0; i < 60; i++) { const h1 = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1, h2 = Math.abs(Math.sin(i * 78.233) * 12543.123) % 1; ell(h1 * W, h2 * H, 3, 3, '#fff', 0); }
      ell(540, 1300, 380, 380, '#dfe6e9'); for (const [cx, cy, r] of [[400, 1200, 60], [650, 1400, 80], [520, 1500, 40]]) ell(cx, cy, r, r, '#b2bec3', 0);
      human(540, 1680, .4, g, { cap: '#fff', shirt: '#fff', pants: '#fff', expr: 'shock' });
      ctx.save(); ctx.translate(800, 500); ell(0, 0, 40, 40, '#f9ca24', 0); ctx.globalAlpha = .4; ell(0, 0, 100, 100, '#f9ca24', 0); ctx.restore();
      popText('VUE DE LA LUNE', 540, 260, 150, '#f9ca24', lu - .3, lt, -.04);
    }
  },
  fight(lt, d, g) {
    sky('#74b9ff', '#dff9fb'); ctx.fillStyle = '#b2bec3'; ctx.fillRect(-400, 1450, W + 800, 900);
    const fa = lw(/farine/i, 'fight'), ex = lw(/explosent/i, 'fight'), nu = lw(/nuage/i, 'fight');
    // sac de farine
    if (lt > fa - .3) { ctx.save(); ctx.translate(780, 1750); ctx.rotate(.4); rr(-140, -200, 280, 300, 30, '#fdfdfd', 6); txt('FARINE', 0, -50, 54, '#e17055', 'Anton'); ctx.restore(); ell(600, 1830, 220, 50, '#fff', 0); }
    human(250, 2200, .9, g, { expr: lt > ex ? 'shock' : 'angry', armR: 1.4 });
    if (lt < ex) for (let i = 0; i < 5; i++) { const k = clamp((lt - lw(/foncent/i, 'fight')) / 1.5); robot(lerp(-100 + i * 50, 600, k), 1700 + i * 40, .35, g + i, { evil: true }); }
    else { ctx.save(); const k = clamp((lt - ex) / 1.5); ctx.globalAlpha = 1 - k * .3; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; ell(600 + Math.cos(a) * 300 * (k + .3), 1500 + Math.sin(a) * 260 * (k + .3), 160, 140, '#fdfdfd', 0); } ell(600, 1500, 400 * (k + .3), 300 * (k + .3), '#fdfdfd', 0); ctx.restore(); }
    popText('TON PLAN', 540, 330, 180, '#fff', lw(/plan/i, 'fight'), lt, -.05, ex - .1);
    popText('BOUM', 540, 330, 230, '#ff3838', ex, lt, .06, nu - .1);
    popText('NUAGE BLANC', 540, 330, 170, '#2d3436', nu, lt, -.05);
  },
  end(lt, d, g) {
    const sa = lw(/sac/i, 'end');
    if (lt < sa - .3) { livingRoom(); for (let i = 0; i < 8; i++) txt('✦', 100 + i * 120, 600 + Math.sin(g * 3 + i) * 40, 60, '#74b9ff', 'serif'); popText('SUPER PROPRE', 540, 330, 170, '#74b9ff', lw(/propre/i, 'end'), lt, -.05); }
    else {
      ctx.fillStyle = '#636e72'; ctx.fillRect(-400, -400, W + 800, H + 800);
      for (let i = 0; i < 40; i++) { const h1 = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1, h2 = Math.abs(Math.sin(i * 78.233) * 12543.123) % 1; ell(h1 * W, (h2 * H + g * 20) % H, 6 + (i % 4) * 4, 6 + (i % 4) * 4, '#95a5a6', 0); }
      // le chat, la télécommande, les devoirs… tout est là
      ctx.save(); ctx.translate(800, 1800); cat(); ctx.restore(); ctx.save(); ctx.translate(250, 1850); ctx.rotate(.4); rr(-30, -100, 60, 200, 20, '#2d3436', 5); ctx.restore();
      human(540, 2150, .95, g, { expr: 'sad', hair: '#95a5a6', shirt: '#b2bec3' });
      popText('DANS LE SAC', 540, 330, 190, '#fff', sa - .3, lt, -.05);
    }
  },
  outro(lt, d, g) {
    ctx.fillStyle = '#130f40'; ctx.fillRect(-400, -400, W + 800, H + 800);
    robot(540, 1900, 1.8, g, { evil: true, crown: true, suck: true });
    subscribe(lt);
  },
};
</script></body></html>
