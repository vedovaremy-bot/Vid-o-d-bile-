<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(../lib/fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Anton;src:url(../lib/fonts/Anton.ttf)}
html,body{margin:0;background:#000} canvas{display:block}

<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/engine.js"></script>
<script>
// temps local (dans la scène) d'un mot du texte
const lw = (re, scene, n = 0) => wordTime(re, n, scene) - sceneStart(scene);

// ------------------------------------------------------------ l'escargot
// o: {flip, shades, angry, cracked, blink, bandage, paper, sweat, slime, mood}
function snail(x, y, s, t, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  shadow(0, 0, 150);
  const stretch = 1 + Math.sin(t * 4) * .03;
  // corps
  ctx.save(); ctx.scale(stretch, 1);
  ctx.beginPath(); ctx.moveTo(-170, 0); ctx.quadraticCurveTo(-180, -50, -100, -60); ctx.lineTo(80, -60);
  ctx.quadraticCurveTo(110, -60, 120, -110); ctx.lineTo(130, -190); ctx.quadraticCurveTo(140, -250, 190, -250);
  ctx.quadraticCurveTo(240, -250, 240, -190); ctx.lineTo(230, -40); ctx.quadraticCurveTo(225, 0, 180, 0); ctx.closePath();
  shape(o.body || '#c9d77a');
  ctx.globalAlpha = .25; ell(30, -18, 160, 10, '#6b7a2a', 0); ctx.globalAlpha = 1;
  ctx.restore();
  // antennes + yeux
  const head = [185 * stretch, -240];
  const ey = o.blink ? 1 : 0;
  for (const [dx, ph] of [[-30, 0], [30, 1.3]]) {
    const ex = head[0] + dx + Math.sin(t * 3 + ph) * 10, eyY = head[1] - 110;
    ctx.beginPath(); ctx.moveTo(head[0] + dx * .4, head[1] + 10); ctx.quadraticCurveTo(head[0] + dx, head[1] - 60, ex, eyY); shape(null, 14, '#9caa4a');
    line(head[0] + dx * .4, head[1] + 10, ex, eyY, '#c9d77a', 0);
    ell(ex, eyY, 30, 30, '#fff', 5);
    if (ey) line(ex - 22, eyY, ex + 22, eyY, OUT, 6); else { ell(ex + 6, eyY + 3, 12, 13, '#111', 0); ell(ex + 10, eyY - 2, 4, 4, '#fff', 0); }
    if (o.angry) { ctx.save(); ctx.beginPath(); ctx.ellipse(ex, eyY, 31, 31, 0, Math.PI * 1.05, Math.PI * 1.95); shape('#9caa4a', 5); ctx.restore(); }
  }
  if (o.shades) { rr(head[0] - 72, head[1] - 140, 70, 46, 14, '#111', 5); rr(head[0] + 2, head[1] - 140, 70, 46, 14, '#111', 5); line(head[0] - 5, head[1] - 120, head[0] + 5, head[1] - 120, '#111', 8); ctx.globalAlpha = .5; line(head[0] - 60, head[1] - 128, head[0] - 40, head[1] - 128, '#fff', 5); ctx.globalAlpha = 1; }
  // bouche
  if (o.angry) { line(head[0] + 10, head[1] + 40, head[0] + 45, head[1] + 30, OUT, 6); }
  else if (o.mood === 'smile') { ctx.beginPath(); ctx.arc(head[0] + 25, head[1] + 20, 22, Math.PI * .15, Math.PI * .85); shape(null, 6); }
  else line(head[0] + 12, head[1] + 35, head[0] + 40, head[1] + 35, OUT, 6);
  if (o.sweat) { const k = (t * 1.5) % 1; ell(head[0] - 50, head[1] - 20 + k * 60, 9, 14, '#74b9ff', 3); }
  // coquille
  if (!o.noShell) {
  ctx.save(); ctx.translate(-20, -150);
  ell(0, 0, 135, 125, o.shellColor || '#c8743c');
  ctx.beginPath(); for (let a = 0; a < Math.PI * 5.2; a += .1) { const r = 110 - a * 6.6; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r * .93); } shape(null, 9, '#8a4b24');
  if (o.cracked) { ctx.beginPath(); ctx.moveTo(-20, -125); ctx.lineTo(0, -80); ctx.lineTo(-30, -50); ctx.lineTo(10, -10); ctx.lineTo(-10, 30); shape(null, 8, '#2a1f1a'); }
  if (o.bandage) { ctx.save(); ctx.rotate(-.5); rr(-90, -30, 180, 54, 10, '#f5e6c8', 5); line(-40, -30, -40, 24, '#d8c49c', 4); line(40, -30, 40, 24, '#d8c49c', 4); ctx.restore(); }
  ctx.restore();
  }
  if (o.paper) { ctx.save(); ctx.translate(310, -200); ctx.rotate(.15); rr(-50, -70, 100, 140, 6, '#fffdf3', 5); for (let i = 0; i < 4; i++) line(-30, -40 + i * 25, 30, -40 + i * 25, '#aaa', 5); ctx.restore(); }
  ctx.restore();
}
function slimeTrail(x1, x2, y, alpha = .5) {
  ctx.save(); ctx.globalAlpha = alpha; rr(Math.min(x1, x2), y - 14, Math.abs(x2 - x1), 28, 14, '#bfe9ff', 0);
  ctx.globalAlpha = alpha * 1.4; for (let x = Math.min(x1, x2) + 30; x < Math.max(x1, x2); x += 90) ell(x, y - 4, 10, 4, '#fff', 0); ctx.restore();
}
function house(x, y, s, col = '#f6e3c5') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-260, -420, 520, 420, 6, col); poly([[-300, -410], [0, -640], [300, -410]], '#c0392b');
  rr(-60, -230, 120, 230, 8, '#6d4c41'); ell(35, -115, 9, 9, '#f1c40f', 3);
  rr(-220, -340, 120, 110, 6, '#ffd56b'); rr(100, -340, 120, 110, 6, '#ffd56b');
  ctx.restore();
}
function road(y, h = 260) {
  ctx.fillStyle = '#4b4b52'; ctx.fillRect(-400, y, W + 800, h);
  for (let x = -400; x < W + 400; x += 160) rr(x, y + h / 2 - 10, 90, 20, 6, '#f5f5f5', 0);
}
function grass(y) { ctx.fillStyle = '#7bc35b'; ctx.fillRect(-400, y, W + 800, H + 800 - y); }
function popText(s, x, y, size, col, t0, lt, rot = -.06, until = 1e9) {
  if (lt < t0 || lt > until) return;
  const k = easeOutBack((lt - t0) / .3);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.rotate(rot); txt(s, 0, 0, size, col, 'Anton', 'center', size * .13); ctx.restore();
}

window.HANDLE = '@histoires.debiles';
window.SCENES = {
  hook(lt, d, g) {
    sky('#ffb37a', '#ffe2b8');
    ell(820, 620, 120, 120, '#fff3c4', 0);
    grass(1250); road(1300, 280);
    house(820, 1300, 1.0);
    // toi à la fenêtre (choqué)
    ctx.save(); ctx.beginPath(); ctx.rect(600, 960, 120, 110); ctx.clip(); human(660, 1430, .45, g, { expr: 'shock' }); ctx.restore();
    slimeTrail(-300, 380 - lt * 20, 1560, .6);
    snail(330 - lt * 20 * -1, 1580, 1.55, g, { shades: true, mood: 'smile' });
    popText('7 ANS', 540, 360, 230, '#ffd32a', lw(/sept/i, 'hook'), lt, -.06);
    popText('J-1', 820, 1730, 140, '#ff4757', lw(/demain/i, 'hook'), lt, .08);
  },
  beach(lt, d, g) {
    sky('#5ec4f5', '#c9efff'); ell(850, 280, 110, 110, '#ffe066', 0); clouds(g);
    ctx.fillStyle = '#2e86de'; ctx.fillRect(-400, 900, W + 800, 220);
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(i * 160 - ((g * 40) % 160), 905, 40, Math.PI, 0); ctx.fillStyle = '#54a0ff'; ctx.fill(); }
    ctx.fillStyle = '#f6d58e'; ctx.fillRect(-400, 1100, W + 800, 1300);
    // parasol
    line(160, 1500, 230, 1050, '#6d4c41', 12); ctx.beginPath(); ctx.arc(230, 1050, 200, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); shape('#ff6b6b');
    const crackT = lw(/coquille/i, 'beach');
    const hx = lerp(-200, 560, clamp(lt / crackT)) + Math.max(0, lt - crackT) * 40;
    snail(640, 1640, .8, g, { cracked: lt > crackT, angry: lt > crackT + .3, blink: lt < crackT && (g % 2.5) > 2.35 });
    human(hx, 1760, .95, g, { pose: lt < crackT ? 'run' : 'stand', expr: lt > crackT ? 'shock' : 'neutral', shirt: '#ffeaa7' });
    if (lt > crackT && lt < crackT + 1.4) {
      const k = easeOutBack((lt - crackT) / .25);
      ctx.save(); ctx.translate(640, 980); ctx.scale(k, k);
      poly([[0, -150], [40, -50], [150, -80], [70, 0], [160, 80], [40, 50], [0, 150], [-40, 50], [-160, 80], [-70, 0], [-150, -80], [-40, -50]], '#ffd32a', 6);
      txt('CRAC !', 0, 0, 90, '#ff3838', 'Anton', 'center', 10); ctx.restore();
    }
    popText('OUPS…', 540, 420, 160, '#fff', crackT + 1.5, lt, .05);
  },
  revenge(lt, d, g) {
    // fond "rage" : rayons rouges qui tournent
    ctx.fillStyle = '#5a0b0b'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.save(); ctx.translate(540, 1000); ctx.rotate(g * .3);
    for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); poly([[0, 0], [-120, -1600], [120, -1600]], i % 2 ? '#8e1111' : '#b71c1c', 0); }
    ctx.restore();
    // petit toi qui s'excuse
    human(200, 1900, .6, g, { expr: 'sad', armL: -.6, armR: .6 });
    if (lt < 1.4) { rr(40, 1180, 330, 110, 30, '#fff'); txt('Pardon…', 205, 1235, 56, OUT, 'Mont'); }
    const k = ease(lt / (d * .8));
    snail(lerp(560, 480, k), 1500, lerp(2.0, 2.6, k), g, { cracked: true, bandage: true, angry: lt > 1.0 });
    const v = lw(/venger/i, 'revenge');
    if (lt > v) { ctx.globalAlpha = clamp((lt - v) / .2) * .35; ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    popText('VENGEANCE', 540, 340, 190, '#ff3838', v, lt, -.05);
  },
  journey(lt, d, g) {
    // carte parchemin
    const night = Math.sin(g * 2.2) > 0;
    ctx.fillStyle = '#e9d6a7'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.globalAlpha = .15; for (let i = 0; i < 30; i++) { const R = rnd(i + 9); ell(R() * W, R() * H, 60 + R() * 120, 30 + R() * 60, '#8a6d3b', 0); } ctx.globalAlpha = 1;
    // départ (plage) -> arrivée (maison)
    txt('🏖', 170, 1450, 120, '#000', 'serif'); txt('PLAGE', 170, 1560, 50, '#6d4c41');
    house(880, 560, .35); txt('CHEZ TOI', 880, 610, 50, '#6d4c41');
    const path = t => { const x = lerp(220, 860, t), y = lerp(1380, 520, t) + Math.sin(t * 9) * 140; return [x, y]; };
    ctx.setLineDash([22, 22]); ctx.beginPath(); for (let i = 0; i <= 100; i++) { const [x, y] = path(i / 100); ctx.lineTo(x, y); } shape(null, 8, '#b33939'); ctx.setLineDash([]);
    const prog = .05 + .25 * ease(lt / d);
    ctx.beginPath(); for (let i = 0; i <= prog * 100; i++) { const [x, y] = path(i / 100); ctx.lineTo(x, y); } shape(null, 14, '#9ccc65');
    const [sx, sy] = path(prog); snail(sx, sy + 40, .45, g, { angry: true });
    // jour / nuit
    rr(60, 160, 300, 150, 30, night ? '#2c2c54' : '#74b9ff'); txt(night ? '🌙 NUIT' : '☀ JOUR', 210, 238, 64, '#fff', 'Anton');
    popText('1 cm / min', 720, 260, 120, '#b33939', lw(/centimètre/i, 'journey'), lt, .04);
  },
  salt(lt, d, g) {
    const s2 = lw(/champ/i, 'salt') - .3;
    if (lt < s2) {
      sky(); clouds(g); grass(1000); road(1150, 600);
      // voitures qui foncent
      for (let i = 0; i < 3; i++) { const x = ((g * 1400 + i * 700) % 2200) - 600, y = 1210 + i * 180; rr(x, y, 300, 110, 30, ['#e74c3c', '#3498db', '#f1c40f'][i]); ell(x + 70, y + 110, 34, 34, '#222'); ell(x + 230, y + 110, 34, 34, '#222'); }
      snail(540, 1520, .9, g, { shades: true });
      popText('x3 AUTOROUTES', 540, 400, 130, '#ffd32a', lw(/autoroutes/i, 'salt'), lt);
    } else {
      sky('#bcd7ec', '#f3f8ff'); ctx.fillStyle = '#f7f7f7'; ctx.fillRect(-400, 1050, W + 800, 1400);
      const R = rnd(4); for (let i = 0; i < 160; i++) ell(R() * W, 1060 + R() * 900, 4, 4, '#dfe6e9', 0);
      const melt = clamp((lt - s2) / 3);
      snail(540, 1560, .95, g, { sweat: true, body: `hsl(66, ${50 - melt * 20}%, ${64 + melt * 6}%)` });
      ctx.save(); ctx.globalAlpha = .45; ell(560, 1580, 200 + melt * 80, 30, '#c9d77a', 0); ctx.restore();
      popText('SEL', 540, 450, 220, '#fff', 0, lt - s2, -.05);
      popText('IL FOND !', 540, 700, 130, '#ff3838', lw(/fondre/i, 'salt'), lt, .05);
    }
  },
  train(lt, d, g) {
    sky('#9fd8ff', '#e3f6ff');
    // paysage qui défile
    for (let i = 0; i < 6; i++) { const x = ((-g * 900 + i * 380) % 2280 + 2280) % 2280 - 600; line(x, 600, x, 1500, '#5d4037', 14); ell(x, 600, 90, 90, '#6ab04c'); }
    grass(1500);
    // wagon
    rr(-60, 700, 1200, 700, 30, '#0a8f60'); rr(-60, 1300, 1200, 60, 0, '#056b47', 0);
    for (let i = 0; i < 3; i++) { ell(150 + i * 400, 1420, 60, 60, '#333'); }
    rr(60, 800, 960, 440, 20, '#d6f1ff');
    ctx.save(); ctx.beginPath(); ctx.roundRect(60, 800, 960, 440, 20); ctx.clip();
    rr(80, 1050, 400, 220, 20, '#b33939'); // siège
    snail(300, 1100, .55, g, { shades: true, mood: 'smile' });
    const ctrl = lw(/contrôleur/i, 'train');
    if (lt > ctrl - .3) human(760, 1800, .9, g, { cap: '#1e3799', shirt: '#4a69bd', expr: lt > lw(/rien/i, 'train') ? 'sad' : 'angry', armL: lt > lw(/rien/i, 'train') ? -1.3 : .15, armR: lt > lw(/rien/i, 'train') ? 1.3 : -.15 });
    ctx.restore();
    popText('SANS BILLET', 540, 450, 150, '#ffd32a', lw(/billet/i, 'train'), lt);
  },
  moving(lt, d, g) {
    room();
    // cartons
    for (let i = 0; i < 5; i++) { const R = rnd(i + 2); rr(60 + i * 190, 1450 - (i % 2) * 140, 170, 140, 6, '#d7a86e'); line(60 + i * 190, 1480 - (i % 2) * 140, 230 + i * 190, 1480 - (i % 2) * 140, '#b5884f', 6); }
    // porte avec bave
    rr(620, 480, 360, 920, 10, '#8d6e63'); ell(940, 960, 16, 16, '#f1c40f', 4);
    const b = lw(/bave/i, 'moving');
    if (lt > b) { const k = clamp((lt - b) / .8); ctx.save(); ctx.globalAlpha = .75; ctx.beginPath(); ctx.moveTo(640, 1380); for (let i = 0; i <= 30 * k; i++) ctx.lineTo(650 + i * 10, 1380 - Math.sin(i * .5) * 120 - i * 20); shape(null, 30, '#bfe9ff'); ctx.restore(); }
    human(330, 1900, 1.0, g, { expr: lt > b ? 'shock' : 'neutral', armL: -.9, armR: .9 });
    const n = Math.min(4, 1 + Math.floor(lt / 1.0));
    popText(`DÉMÉNAGEMENT x${n}`, 540, 300, 120, '#ffd32a', lw(/quatre/i, 'moving'), lt);
  },
  street(lt, d, g) {
    // haut : la rue avec l'escargot
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 960); ctx.clip();
    sky('#ffd29d', '#fff1d6'); grass(700); road(720, 200);
    for (let i = 0; i < 3; i++) house(140 + i * 400, 700, .45, ['#f6e3c5', '#dff9fb', '#ffeaa7'][i]);
    slimeTrail(-200, 520 + lt * 15, 880, .6);
    snail(540 + lt * 15, 900, .6, g, { shades: lt > lw(/lunettes/i, 'street') - .2, mood: 'smile' });
    ctx.restore();
    line(0, 960, W, 960, '#000', 12);
    // bas : toi au téléphone
    ctx.save(); ctx.beginPath(); ctx.rect(0, 960, W, 960); ctx.clip();
    room();
    human(540, 2050, 1.0, g, { phone: true, armR: 2.75, expr: lt > lw(/escargot/i, 'street') ? 'shock' : 'neutral' });
    rr(620, 1450, 420, 130, 30, '#fff'); txt('📞 Le voisin', 830, 1515, 50, OUT, 'Mont');
    ctx.restore();
  },
  barricade(lt, d, g) {
    room();
    rr(620, 480, 360, 920, 10, '#8d6e63');
    // meubles devant la porte
    const k1 = easeOutBack((lt - lw(/bloques/i, 'barricade')) / .4);
    if (k1 > 0) { ctx.save(); ctx.translate(800, 1400); ctx.scale(k1, k1); sofa(0, 0, .55); rr(-160, -520, 320, 260, 10, '#a0522d'); rr(-120, -760, 240, 240, 10, '#b5884f'); ctx.restore(); }
    // sacs de sel
    const k2 = clamp((lt - lw(/remplis/i, 'barricade')) / 1.5);
    const R = rnd(21);
    for (let i = 0; i < Math.floor(k2 * 14); i++) { const x = 60 + R() * 900, y = 1500 + R() * 380; rr(x - 70, y - 90, 140, 180, 30, '#fff'); txt('SEL', x, y, 46, '#2d3436'); }
    human(320, 1900, 1.0, g, { expr: 'shock', pose: 'shock' });
    popText('PANIQUE', 540, 300, 180, '#ff3838', 0.2, lt);
  },
  door(lt, d, g) {
    const ks = [0, 1, 2].map(i => lw(/toc/i, 'door', i));
    let shake = 0; for (const k of ks) if (lt > k && lt < k + .2) shake = (1 - (lt - k) / .2) * 22;
    const open = lw(/ouvres/i, 'door');
    ctx.fillStyle = '#1a1626'; ctx.fillRect(-400, -400, W + 800, H + 800);
    ctx.save(); ctx.translate(Math.sin(lt * 120) * shake, 0);
    rr(200, 300, 680, 1300, 10, '#5d4037');
    if (lt > open) {
      // porte ouverte : l'escargot est là, lunettes de soleil, de nuit
      const k = ease((lt - open) / .5);
      rr(220, 320, 640, 1260, 4, '#0b0b2b');
      ell(700, 520, 50, 50, '#fff6c8', 0);
      snail(560, 1560, 1.25, g, { shades: true, mood: 'smile', paper: lt > d - .2 });
      ctx.save(); ctx.translate(220, 320); ctx.scale(1 - k * .85, 1); rr(0, 0, 640, 1260, 4, '#6d4c41'); ctx.restore();
    } else {
      rr(220, 320, 640, 1260, 4, '#6d4c41');
      rr(300, 420, 480, 420, 8, '#5a3d33'); rr(300, 960, 480, 520, 8, '#5a3d33');
      ell(800, 960, 20, 20, '#f1c40f', 4);
      // barricade de sel
      for (let i = 0; i < 6; i++) { rr(150 + i * 140, 1500 - (i % 2) * 60, 140, 170, 30, '#fff'); txt('SEL', 220 + i * 140, 1585 - (i % 2) * 60, 40, '#2d3436'); }
    }
    ctx.restore();
    ks.forEach((k, i) => { if (lt > k && lt < open) popText('TOC', 300 + i * 240, 220 + i * 40, 130, '#ffd32a', k, lt, (i - 1) * .12); });
    if (lt < ks[0]) { rr(700, 120, 330, 130, 20, '#111'); txt('06:00', 865, 190, 90, '#ff3838', 'Anton'); }
    if (lt > open + 1.0) { ctx.save(); ctx.globalAlpha = .9; human(900, 2300, .9, g, { expr: 'sleep', armL: -2.6, armR: 2.6 }); ctx.restore(); }
  },
  bill(lt, d, g) {
    sky('#0b0b2b', '#2b1b4b');
    const fx = lw(/facture/i, 'bill'), dv = lw(/devis/i, 'bill');
    snail(320, 1900, 1.0, g, { shades: true, mood: 'smile', bandage: true });
    const k = easeOutBack((lt - fx + .4) / .5);
    if (k > 0) {
      ctx.save(); ctx.translate(560, 720); ctx.scale(k * .85, k * .85); ctx.rotate(-.04);
      rr(-380, -520, 760, 1040, 14, '#fffdf3');
      txt('FACTURE', 0, -420, 110, '#2c3e50'); line(-300, -350, 300, -350, '#2c3e50', 5);
      txt('Client : TOI', -300, -270, 46, '#2c3e50', 'Mont', 'left');
      txt('Coquille', -300, -170, 46, '#2c3e50', 'Mont', 'left');
      txt('Pansement', -300, -100, 46, '#2c3e50', 'Mont', 'left');
      txt('Voyage (7 ans)', -300, -30, 46, '#2c3e50', 'Mont', 'left');
      txt('40,00 €', 300, -170, 46, '#2c3e50', 'Mont', 'right'); txt('3,00 €', 300, -100, 46, '#2c3e50', 'Mont', 'right'); txt('offerts', 300, -30, 46, '#2c3e50', 'Mont', 'right');
      line(-300, 60, 300, 60, '#2c3e50', 5);
      if (lt > lw(/quarante/i, 'bill')) txt('TOTAL : 43 €', 0, 170, 110, '#e74c3c');
      if (lt > dv) { const s = easeOutBack((lt - dv) / .25); ctx.save(); ctx.translate(120, 380); ctx.scale(s, s); ctx.rotate(-.25); rr(-230, -80, 460, 160, 14, null, 12); ctx.strokeStyle = '#e74c3c'; txt('DEVIS', 0, 5, 130, '#e74c3c'); ctx.restore(); }
      ctx.restore();
    }
    popText('7 ANS', 830, 1650, 130, '#ffd32a', lw(/sept/i, 'bill'), lt, .08);
  },
  outro(lt, d, g) {
    ctx.fillStyle = '#05050f'; ctx.fillRect(-400, -400, W + 800, H + 800);
    const li = lw(/limace/i, 'outro');
    if (lt > li - .3) {
      const k = ease((lt - li + .3) / 1.2);
      ctx.save(); ctx.globalAlpha = k;
      snail(540, 1450, 1.6, g, { angry: true, noShell: true, body: '#c56d4b' });
      ctx.restore();
      popText('LA COUSINE', 540, 520, 160, '#ff3838', li, lt, -.05);
    } else {
      snail(540, 1400, 1.2, g, { shades: true, mood: 'smile', bandage: true });
    }
    const p = easeOutBack((lt - .1) / .4);
    if (lt < li - .3 && p > 0) { ctx.save(); ctx.translate(540, 520); ctx.scale(p, p); rr(-300, -80, 600, 160, 80, '#ff3838', 0); txt("S'ABONNER", 0, 6, 90, '#fff', 'Anton'); ctx.restore(); }
  },
};
